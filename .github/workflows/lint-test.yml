name: Vitest Tests & Linting
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  TOTAL_PCT: 0

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          cache: true
          runtime: node@24
          cache-dependency-path: "pnpm-lock.yaml"
          package-json-file: "package.json"

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Run Vitest with coverage
        run: pnpm test:run --coverage

      - name: Run build
        run: pnpm build

      - name: Generate Coverage Report Summary
        if: ${{ !cancelled() }}
        id: coverage
        run: pnpm exec tsx .\scripts\comments\coverage-summary

      - name: Post Coverage Comment on PR
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: pnpm exec tsx .\scripts\comments\vitest

      - name: Upload HTML Coverage Artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
