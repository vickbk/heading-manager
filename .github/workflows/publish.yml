name: Publish package to npm

on:
  push:
    tags:
      - "v*"

env:
  DIST_TAG: latest
  IS_PRERELEASE: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches full history so GitHub can generate release notes

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          cache: true

      - name: Install Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Run Vitest
        run: pnpm test run

      - name: Build distribution artifacts
        run: pnpm build

      - name: Verify documentation drifts
        run: pnpm readme-check

      - name: Write tag to environment
        run: pnpm release-tag

      - name: Publish package
        run: pnpm publish --access public --tag ${{ env.DIST_TAG }} --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract Release Notes from CHANGELOG.md
        run: pnpm release-note

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_CHANGELOG.md
          draft: false
          prerelease: ${{env.IS_PRERELEASE}}
